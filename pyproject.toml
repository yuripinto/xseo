[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xseo"
version = "0.1.0"
description = "Local-first desktop SEO crawler prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3",
  "PySide6>=6.7",
]

[project.scripts]
xseo-ui = "xseo.ui.app:main"

[project.optional-dependencies]
test = [
  "pytest>=8",
  "hypothesis>=6",
  "pytest-qt>=4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
