[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xseo"
version = "0.4.0"
description = "Local-first desktop SEO crawler"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Yuri Silva" }]
keywords = ["seo", "crawler", "desktop", "audit", "local-first"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3",
  "PySide6>=6.7",
]

[project.urls]
Homepage = "https://github.com/yuripinto/xseo"
Repository = "https://github.com/yuripinto/xseo"
Issues = "https://github.com/yuripinto/xseo/issues"

[project.scripts]
xseo = "xseo.cli:main"
xseo-ui = "xseo.ui.app:main"

[project.optional-dependencies]
test = [
  "pytest>=8",
  "hypothesis>=6",
  "pytest-qt>=4",
]
dev = [
  "ruff>=0.6",
]
package = [
  "pyinstaller>=6",
  "build>=1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# The formatter owns line length; E501 only fires on lines it can't wrap
# (long strings, URLs, expressions), so leave those to the formatter.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Imports are intentionally placed after runtime setup (Qt platform, sys.path).
"tests/smoke/test_ui_smoke.py" = ["E402"]
"tests/strategies/domain.py" = ["E402"]
