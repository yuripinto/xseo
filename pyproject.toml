[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xseo"
version = "0.1.0"
description = "Local-first desktop SEO crawler prototype"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3",
  "PySide6>=6.7",
]

[project.scripts]
xseo-ui = "xseo.ui.app:main"

[project.optional-dependencies]
test = [
  "pytest>=8",
  "hypothesis>=6",
  "pytest-qt>=4",
]
dev = [
  "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# The formatter owns line length; E501 only fires on lines it can't wrap
# (long strings, URLs, expressions), so leave those to the formatter.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Imports are intentionally placed after runtime setup (Qt platform, sys.path).
"tests/smoke/test_ui_smoke.py" = ["E402"]
"tests/strategies/domain.py" = ["E402"]
